# -----------------------------------------------------
# Keyboard Layout (Hyprland 0.53.0)
# -----------------------------------------------------

# === Keyboard ===
input:kb_layout = us,th
input:kb_options = grp:ctrl_space_toggle
input:numlock_by_default = true

# === Mouse / Focus ===
input:follow_mouse = 1
input:sensitivity = 1

# === Silakka54 mouse keys (set up in Vial) ===
# Overrides the global sensitivity above, which is too fast for mouse keys
device {
    name          = squalius-cephalus-silakka54-mouse
    accel_profile = flat     # mouse keys already accelerate in firmware
    sensitivity   = -0.5     # <-- tune here, range -1.0 .. 1.0
}

# === Key repeat ===
input:repeat_rate = 50
input:repeat_delay = 200

# -----------------------------------------------------
# Touchpad / Trackpad -> moved to conf/trackpad.conf
# -----------------------------------------------------
